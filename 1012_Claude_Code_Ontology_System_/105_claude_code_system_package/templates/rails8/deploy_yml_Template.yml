# Kamal Deploy Configuration Template
# Generated by Rails 8 Vibe Coding Methodology

# 서비스 이름 (컨테이너 이름에 사용)
service: myapp

# Docker 이미지 이름
image: myuser/myapp

# 서버 설정
servers:
  # 웹 서버
  web:
    hosts:
      - 192.168.1.10
      # - 192.168.1.11  # 추가 서버
    labels:
      traefik.http.routers.myapp.rule: Host(`myapp.com`)
      traefik.http.routers.myapp.tls: true
      traefik.http.routers.myapp.tls.certresolver: letsencrypt
    options:
      memory: 2G
      cpus: 2

  # 백그라운드 워커 (Solid Queue)
  worker:
    hosts:
      - 192.168.1.20
    cmd: bundle exec rake solid_queue:start
    options:
      memory: 1G
      cpus: 1

# Container Registry
registry:
  server: ghcr.io
  username: myuser
  password:
    - KAMAL_REGISTRY_PASSWORD

# 환경 변수
env:
  # 일반 변수 (평문)
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    RAILS_SERVE_STATIC_FILES: true
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5

  # 시크릿 변수 (.kamal/secrets에서 로드)
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    # - REDIS_URL
    # - SMTP_PASSWORD

# Proxy 설정 (Traefik)
proxy:
  ssl: true
  host: myapp.com

# 헬스체크
healthcheck:
  path: /up
  port: 3000
  interval: 10
  max_attempts: 30

# 에셋 경로 (Blue-Green 배포 시 에셋 유지)
asset_path: /rails/public/assets

# 빌드 설정
builder:
  # 멀티 아키텍처 (ARM + AMD64)
  multiarch: false
  # 로컬 빌드 (Docker BuildKit)
  local: true
  # 빌드 인자
  args:
    RAILS_ENV: production
  # 캐시
  cache:
    type: gha

# SSH 설정
ssh:
  user: deploy
  # proxy: jump.example.com  # 점프 호스트

# 볼륨 (영구 저장소)
volumes:
  - "myapp_storage:/rails/storage"

# 부가 서비스 (선택)
# accessories:
